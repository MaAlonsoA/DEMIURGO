name: CI

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Pytest
        run: python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run browser E2E
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e
      - name: Build application image
        run: docker build -t demiurgo:ci .
      - name: Start container with isolated persistent paths
        run: |
          mkdir -p "$RUNNER_TEMP/demiurgo-data" "$RUNNER_TEMP/demiurgo-codex"
          docker run -d --name demiurgo-ci -p 127.0.0.1:8080:8000 \
            -e DEMIURGO_DB=/data/demiurgo.db -e CODEX_HOME=/codex -e DEMIURGO_DISABLE_CODEX=1 \
            -v "$RUNNER_TEMP/demiurgo-data:/data" \
            -v "$RUNNER_TEMP/demiurgo-codex:/codex" demiurgo:ci
      - name: Check health, API, and migrations
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/api/state | python -c "import json,sys; state=json.load(sys.stdin); assert 'explorations' in state and 'tasks' in state"
          docker exec demiurgo-ci python -c "import sqlite3; c=sqlite3.connect('/data/demiurgo.db'); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; assert c.execute('SELECT version_num FROM alembic_version').fetchone()"
      - name: Run browser E2E against the container
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          DEMIURGO_E2E_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e
      - name: Show container logs on failure
        if: failure()
        run: docker logs demiurgo-ci
      - name: Stop container
        if: always()
        run: docker rm -f demiurgo-ci || true
