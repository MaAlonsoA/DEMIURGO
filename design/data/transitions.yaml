# DEMIURGO v2 transition tables.
# Every transition comes from here: what isn't here returns 409 with no effects. Annex of ADR-NUC-001.
# from: new  -> the command creates the entity in the "to" state.
# authority     -> states only reached by an event from a human actor (I1).
code: DAT-TRA-001
version: 1
state: proposed

entities:
  project:
    label: Project
    implemented_in: S0
    states: { active: Active, archived: Archived }
    authority: []
    transitions:
      - { command: project.create, from: new, to: active }
      - { command: project.archive, from: [active], to: archived }
      - { command: project.rename, from: [active], to: active }
      - { command: repository.connect, from: [active], to: active }
      - { command: build.queue_auto, from: [active], to: active }
      - { command: task.hold, from: [active], to: active }
      - { command: task.release, from: [active], to: active }
      - { command: task.mark_satisfied, from: [active], to: active }

  agent_token:
    label: Agent token
    implemented_in: S1
    states: { active: Active, revoked: Revoked }
    authority: []
    transitions:
      - { command: agent_token.issue, from: new, to: active, guards: [valid_agent_name] }
      - { command: agent_token.revoke, from: [active], to: revoked }

  exploration:
    label: Exploration
    implemented_in: S1
    states: { active: Active, concluded: Concluded, set_aside: Set aside }
    authority: []
    transitions:
      - { command: exploration.open, from: new, to: active, guards: [existing_origin] }
      - { command: exploration.conclude, from: [active], to: concluded }
      - { command: exploration.set_aside, from: [active], to: set_aside, guards: [reason_present] }
      - { command: exploration.resume, from: [concluded, set_aside], to: active }
      - { command: exploration.revise_purpose, from: [active], to: active }

  stage:
    label: Design stage
    implemented_in: S1
    states: { open: Open, passed: Passed }
    authority: [passed]
    transitions:
      - { command: stage.open, from: new, to: open, guards: [stage_in_order] }
      - { command: stage.pass, from: [open], to: passed, guards: [stage_covered] }

  message:
    label: Message
    implemented_in: S1
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: message.post, from: new, to: recorded, guards: [exploration_active] }
      - { command: message.abandon_response, from: [recorded], to: recorded }

  source:
    label: Source
    implemented_in: S1
    states: { registered: Registered }
    authority: []
    transitions:
      - { command: source.register, from: new, to: registered }

  glossary_term:
    label: Glossary term
    implemented_in: S2
    states: { set: Set, removed: Removed }
    authority: [set, removed]
    transitions:
      - { command: glossary.set, from: new, to: set }
      - { command: glossary.remove, from: new, to: removed }

  question:
    label: Question
    implemented_in: S1
    states: { pending: Pending, inferred: Inferred, confirmed: Confirmed, postponed: Postponed, discarded: Discarded }
    authority: [confirmed]
    transitions:
      - { command: question.raise, from: new, to: pending, guards: [exploration_active] }
      - { command: question.infer, from: [pending], to: inferred, guards: [conclusion_present] }
      - { command: question.suggest_options, from: [pending], to: pending }
      - { command: question.set_conversation_option, from: [pending], to: pending }
      - { command: question.set_conversation_option, from: [inferred], to: inferred }
      - { command: question.confirm, from: [pending, inferred], to: confirmed, guards: [conclusion_present] }
      - { command: question.postpone, from: [pending, inferred], to: postponed, guards: [reason_present] }
      - { command: question.discard, from: [pending, inferred, postponed], to: discarded, guards: [reason_present] }
      - { command: question.reopen, from: [confirmed, postponed, discarded], to: pending }

  record:
    label: Record
    implemented_in: S1
    states: { registered: Registered }
    authority: []
    transitions:
      - { command: record.create, from: new, to: registered, guards: [free_code, valid_template] }
      - { command: record.set_size, from: [registered], to: registered, guards: [task_record] }
      - { command: record.keep_size, from: [registered], to: registered, guards: [task_record] }
      - { command: record.move_epic, from: [registered], to: registered, guards: [epic_record] }

  record_version:
    label: Record version
    implemented_in: S1
    states: { draft: Draft, approved: Approved, superseded: Superseded, discarded: Discarded }
    authority: [approved]
    transitions:
      - { command: record_version.create, from: new, to: draft, guards: [record_of_project, valid_template, criteria_carry_complete] }
      - { command: record_version.approve, from: [draft], to: approved, guards: [valid_template, without_later_approved] }
      - { command: record_version.supersede, from: [approved], to: superseded, guards: [has_later_approved] }
      - { command: record_version.discard, from: [draft], to: discarded }

  criterion:
    label: Acceptance criterion
    implemented_in: S1
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: criterion.record, from: new, to: recorded, guards: [within_its_version, version_in_draft] }

  link:
    label: Link
    implemented_in: S1
    states: { current: Current, needs_review: Pending review, kept: Kept, changed: Changed, obsolete: Obsolete }
    authority: []
    transitions:
      - { command: link.create, from: new, to: current, guards: [within_its_version, endpoints_exist] }
      - { command: link.supersede, from: new, to: current, guards: [endpoints_exist] }
      - { command: link.flag_review, from: [current, kept, changed], to: needs_review }
      - { command: link.keep, from: [needs_review], to: kept }
      - { command: link.change, from: [needs_review], to: changed }
      - { command: link.revalidate, from: [current, kept, changed], to: current }
      - { command: link.obsolete, from: [needs_review], to: obsolete }

  batch:
    label: Proposal batch
    implemented_in: S1
    states: { pending: Pending, accepted: Accepted, rejected: Rejected, resolved: Resolved, superseded: Obsolete }
    authority: [accepted]
    transitions:
      - { command: batch.submit, from: new, to: pending, guards: [external_agent_batch_max_10, project_dependencies] }
      - { command: design.import, from: new, to: pending, guards: [valid_design] }
      - { command: batch.show, from: [pending], to: pending }
      - { command: batch.accept_package, from: [pending], to: accepted, guards: [package_resolution, current_dependencies] }
      - { command: batch.reject_package, from: [pending], to: rejected, guards: [package_resolution] }
      - { command: batch.close, from: [pending], to: resolved, guards: [all_proposals_resolved] }
      - { command: batch.supersede, from: [pending], to: superseded }

  proposal:
    label: Proposal
    implemented_in: S1
    states: { pending: Pending, accepted: Accepted, accepted_edited: Accepted with edits, rejected: Rejected, superseded: Obsolete }
    authority: [accepted, accepted_edited]
    transitions:
      - { command: proposal.create, from: new, to: pending, guards: [own_open_batch, valid_payload, project_dependencies] }
      - { command: proposal.accept, from: [pending], to: accepted, guards: [per_element_resolution, current_dependencies] }
      - { command: proposal.accept_edited, from: [pending], to: accepted_edited, guards: [per_element_resolution, current_dependencies, valid_edit] }
      - { command: proposal.reject, from: [pending], to: rejected, guards: [per_element_resolution] }
      - { command: proposal.supersede, from: [pending], to: superseded, guards: [per_element_resolution] }

  ai_run:
    label: Agent run
    implemented_in: S0
    states: { queued: Queued, running: Running, completed: Completed, failed: Failed, cancelled: Cancelled, interrupted: Interrupted }
    authority: []
    transitions:
      - { command: run.request, from: new, to: queued, guards: [graph_up_to_date, no_draft_pending] }
      - { command: run.retry, from: new, to: queued, guards: [original_run_finished] }
      - { command: run.begin, from: [queued], to: running }
      - { command: run.complete, from: [running], to: completed }
      - { command: run.fail, from: [queued, running], to: failed }
      - { command: run.cancel, from: [queued, running], to: cancelled }
      - { command: run.interrupt, from: [running], to: interrupted }

  context_pack:
    label: Context pack
    implemented_in: S0
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: context_pack.build, from: new, to: recorded }

  taxonomy:
    label: Taxonomy
    implemented_in: S2
    states: { draft: Draft, approved: Approved, superseded: Superseded }
    authority: [approved]
    transitions:
      - { command: taxonomy.propose, from: new, to: draft, guards: [valid_taxonomy] }
      - { command: taxonomy.approve, from: [draft], to: approved, guards: [taxonomy_without_later_approved] }
      - { command: taxonomy.supersede, from: [approved], to: superseded }

  classification:
    label: Classification
    implemented_in: S2
    states: { applied: Applied, pending_review: Pending review, resolved: Resolved }
    authority: []
    transitions:
      - { command: classification.record, from: new, to: applied, guards: [valid_classification] }
      - { command: classification.hold, from: new, to: pending_review, guards: [valid_classification] }
      - { command: classification.resolve, from: [pending_review], to: resolved, guards: [taxonomy_categories] }

  knowledge_update:
    label: Knowledge update
    implemented_in: S2
    states: { queued: Queued, classifying: Classifying, verifying: Verifying, applied: Applied, rejected: Rejected }
    authority: []
    transitions:
      - { command: knowledge_update.enqueue, from: new, to: queued }
      - { command: knowledge_update.classify, from: [queued], to: classifying }
      - { command: knowledge_update.verify, from: [classifying], to: verifying }
      - { command: knowledge_update.apply, from: [verifying], to: applied }
      - { command: knowledge_update.reject, from: [classifying, verifying], to: rejected }
      - { command: knowledge_update.retry, from: [rejected], to: queued }

  knowledge_node:
    label: Knowledge node
    implemented_in: S2
    states: { current: Current, invalidated: Invalidated }
    authority: []
    transitions:
      - { command: knowledge_node.project, from: new, to: current }
      - { command: knowledge_node.invalidate, from: [current], to: invalidated }

  knowledge_edge:
    label: Knowledge edge
    implemented_in: S2
    states: { current: Current, invalidated: Invalidated }
    authority: []
    transitions:
      - { command: knowledge_edge.project, from: new, to: current }
      - { command: knowledge_edge.invalidate, from: [current], to: invalidated }

  idea_assessment:
    label: Idea assessment
    implemented_in: S2
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: idea_assessment.record, from: new, to: recorded }

  change_set:
    label: Change Set
    implemented_in: S3
    states:
      proposed: Proposed
      scope_accepted: Scope accepted
      in_progress: In progress
      in_review: In review
      accepted: Accepted
      blocked: Blocked
      paused: Paused
      cancelled: Cancelled
    authority: [scope_accepted, accepted]
    transitions:
      - { command: change_set.propose, from: new, to: proposed, guards: [fdr_ready_to_build] }
      - { command: change_set.accept_scope, from: [proposed], to: scope_accepted, guards: [fdr_ready_to_build, full_coverage] }
      - { command: change_set.start, from: [scope_accepted], to: in_progress, guards: [graph_up_to_date] }
      - { command: change_set.submit_review, from: [in_progress], to: in_review, guards: [gates_green] }
      - { command: change_set.accept, from: [in_review], to: accepted, guards: [gates_green] }
      - { command: change_set.request_changes, from: [in_review], to: in_progress }
      - { command: change_set.block, from: [in_progress], to: blocked }
      - { command: change_set.unblock, from: [blocked], to: in_progress }
      - { command: change_set.pause, from: [scope_accepted, in_progress, in_review, blocked], to: paused }
      - { command: change_set.resume_scope, from: [paused], to: scope_accepted, guards: [fdr_ready_to_build, full_coverage] }
      - { command: change_set.cancel, from: [proposed, scope_accepted, in_progress, in_review, blocked, paused], to: cancelled, guards: [reason_present] }

  task:
    label: Task
    implemented_in: S3
    states:
      open: Open
      tests_written: Tests written
      tests_frozen: Tests frozen
      implementing: Implementing
      checking: Checking
      passed: Passed
      blocked: Blocked
    authority: []
    transitions:
      - { command: task.create, from: new, to: open, guards: [covers_at_least_one_approved_ac] }
      - { command: task.advance, from: [open], to: tests_written }
      - { command: task.advance, from: [tests_written], to: tests_frozen, guards: [test_map_accepted] }
      - { command: task.advance, from: [tests_frozen], to: implementing }
      - { command: task.advance, from: [implementing], to: checking }
      - { command: task.pass, from: [checking], to: passed, guards: [gates_green] }
      - { command: task.return, from: [checking], to: implementing, guards: [attempts_remaining] }
      - { command: task.block, from: [open, tests_written, tests_frozen, implementing, checking], to: blocked }
      - { command: task.retry, from: [blocked], to: implementing }
      - { command: task.clarify, from: [blocked], to: implementing, guards: [clarification_present] }

  acceptance_check:
    label: Acceptance test
    implemented_in: S3
    states: { proposed: Proposed, mapped: Map accepted, frozen: Frozen }
    authority: [mapped]
    transitions:
      - { command: acceptance_check.propose, from: new, to: proposed }
      - { command: acceptance_map.accept, from: [proposed], to: mapped }
      - { command: acceptance_check.freeze, from: [mapped], to: frozen, guards: [red_test_on_base] }

  work_step:
    label: Work step
    implemented_in: S3
    states: { queued: Queued, running: Running, succeeded: Succeeded, failed: Failed, cancelled: Cancelled }
    authority: []
    transitions:
      - { command: work_step.enqueue, from: new, to: queued }
      - { command: work_step.begin, from: [queued], to: running }
      - { command: work_step.succeed, from: [running], to: succeeded }
      - { command: work_step.fail, from: [queued, running], to: failed }
      - { command: work_step.cancel, from: [queued, running], to: cancelled }

  planned_feature:
    label: Planned feature
    implemented_in: S1
    states: { planned: Planned, designed: Designed, dropped: Dropped }
    authority: []
    transitions:
      - { command: planned_feature.add, from: new, to: planned, guards: [epic_of_project] }
      - { command: planned_feature.move, from: [planned], to: planned }
      - { command: planned_feature.move, from: [designed], to: designed }
      - { command: planned_feature.drop, from: [planned], to: dropped }
      - { command: planned_feature.design, from: [planned], to: designed }

  evidence:
    label: Evidence
    implemented_in: S4
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: evidence.record, from: new, to: recorded, guards: [ac_manual] }
      - { command: evidence.ingest_junit, from: new, to: recorded }
      - { command: evidence.record_manual, from: new, to: recorded, guards: [ac_manual] }

  build_request:
    label: Build request
    implemented_in: S4
    states: { requested: Requested, in_review: In review, done: Done, withdrawn: Withdrawn }
    authority: []
    transitions:
      - { command: build_request.request, from: new, to: requested }
      - { command: build_request.submit_review, from: [requested], to: in_review }
      - { command: build_request.complete, from: [in_review], to: done }
      - { command: build_request.withdraw, from: [requested, in_review], to: withdrawn }

  build_step:
    label: Build step
    implemented_in: S4
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: build.start, from: new, to: recorded, guards: [build_can_start] }
      - { command: build_step.record, from: new, to: recorded }

  harness_postmortem:
    label: Harness post-mortem
    implemented_in: S4
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: harness.postmortem, from: new, to: recorded }

  pr_review:
    label: PR review
    implemented_in: S4
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: pr_review.record, from: new, to: recorded }

  task_forensics:
    label: Task forensics
    implemented_in: S4
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: task_forensics.record, from: new, to: recorded }

  forensic_playbook:
    label: Forensic playbook
    implemented_in: S4
    states: { recorded: Recorded }
    authority: []
    transitions:
      - { command: forensic_playbook.record, from: new, to: recorded }

  issue:
    label: Issue
    implemented_in: S4
    states: { open: Open, resolved: Resolved, closed: Closed }
    authority: [resolved, closed]
    transitions:
      - { command: issue.open, from: new, to: open }
      - { command: issue.resolve, from: [open], to: resolved, guards: [issue_fix_exists] }
      - { command: issue.close, from: [open], to: closed, guards: [reason_present] }
      - { command: issue.reopen, from: [resolved, closed], to: open }
