# v2 instance (design authority from H1). Its own compose project: demiurgo-v2.
# Data in a named volume (not an NTFS bind mount). Never demiurgo-stable nor port 8000.
# The API runs on the host (it needs the Claude CLI with the subscription): see docs/informe-autonomo-v2-h1.md.
services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: demiurgo
      POSTGRES_PASSWORD: ${DEMIURGO_V2_DB_PASSWORD:-demiurgo-v2-local}
      POSTGRES_DB: demiurgo_v2
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demiurgo -d demiurgo_v2"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
