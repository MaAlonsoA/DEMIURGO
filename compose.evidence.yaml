# Evidence stack of the observability engine (docs/superpowers/specs/2026-09-26-motor-observabilidad-design.md §4.2).
# Its own compose project, demiurgo-evidence, with its own volumes: `pnpm snap`, `pnpm db:down -v` and
# `docker compose down -v` of the other projects never touch it. Never demiurgo-stable nor port 8000.
# The ingester (`pnpm evidence serve`, 127.0.0.1:4319) runs on the host; the collector reaches it through
# host.docker.internal. Start it with `pnpm evidence:up` (packages/evidence/src/up.ts): it generates the
# untracked `packages/evidence/.env` with the Phoenix and Metabase secrets and passes it to compose as --env-file.
name: demiurgo-evidence
services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence-local
      POSTGRES_DB: demiurgo_evidence
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - evidence-data:/var/lib/postgresql
      # Creates the `phoenix` database and the read-only role `evidence_reader` on the first start only.
      - ./packages/evidence/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d demiurgo_evidence"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    # The image runs as uid 10001 over a scratch filesystem and named volumes are created root-owned, so the
    # archive and the persistent queue would be unwritable. Local single-user stack: run it as root.
    user: "0:0"
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:13133:13133" # health_check extension
    volumes:
      - evidence-archive:/archive
      - evidence-queue:/queue
      - ./packages/evidence/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # The bearer token of the Phoenix exporter (config.yaml reads it as ${env:PHOENIX_SYSTEM_KEY}).
      PHOENIX_SYSTEM_KEY: ${PHOENIX_SYSTEM_KEY:?set in packages/evidence/.env (pnpm evidence:up creates it)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No healthcheck: the contrib image is built on scratch (no shell, curl or wget), so nothing can run
    # inside it. Check from the host instead: curl -s http://127.0.0.1:13133/ (health_check extension).
    restart: unless-stopped

  # Phoenix (phase 4, spec §12): the trace viewer, on the `phoenix` database of this postgres. It only
  # receives traces, from the collector's otlp_grpc/phoenix exporter over the compose network (its gRPC
  # port 4317 is not published on the host). Authentication is on: the secrets come from the untracked
  # packages/evidence/.env (see .env.example); sign in as admin@localhost with PHOENIX_ADMIN_PASSWORD.
  # The collector ingests with the admin secret as its bearer token (Phoenix accepts it on the OTLP
  # receivers), so no API key has to be created by hand after the first start.
  phoenix:
    image: arizephoenix/phoenix:version-20.16.0@sha256:d55a4ffac8c670e2d0bf72e44e81e32a73e832b7ce449e6e4567487adfa9d8d6
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://evidence:evidence-local@postgres:5432/phoenix
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:?set in packages/evidence/.env (pnpm evidence:up creates it)}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_SYSTEM_KEY:?set in packages/evidence/.env (pnpm evidence:up creates it)}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?set in packages/evidence/.env (pnpm evidence:up creates it)}
      # Nothing leaves the machine: Phoenix's own usage analytics are off.
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:6006:6006"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Metabase (phase 5, spec §12, §15.3): the dashboard, on 127.0.0.1:3300. Its own application database
  # (H2, on the evidence-metabase volume: a local viewer does not need more, and it keeps its state out of
  # demiurgo_evidence). It reads demiurgo_evidence as the read-only role evidence_reader. The admin account
  # (evidence@demiurgo.local) and the first dashboard are created by `pnpm evidence metabase-setup`
  # (packages/evidence/src/metabase.ts) with METABASE_ADMIN_PASSWORD from the untracked packages/evidence/.env.
  metabase:
    image: metabase/metabase:v0.63.18.2@sha256:ca6d63cbedfd0a66a3c0239ac79a9df5f7ef3f2455027ab97e3bb26cbf281999
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: http://127.0.0.1:3300
      # Nothing leaves the machine: no anonymous usage tracking, no version checks.
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # No sample database: the only data here is demiurgo_evidence.
      MB_LOAD_SAMPLE_CONTENT: "false"
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - evidence-metabase:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  evidence-data:
  evidence-archive:
  evidence-queue:
  evidence-metabase:
