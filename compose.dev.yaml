# Postgres de desarrollo y pruebas de la v2. Proyecto compose propio: demiurgo-v2-dev.
# Nunca apuntes aquí la instancia estable ni los datos de %LOCALAPPDATA%\Demiurgo.
services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: demiurgo
      POSTGRES_PASSWORD: demiurgo-dev
      POSTGRES_DB: demiurgo_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demiurgo -d demiurgo_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  datos:
