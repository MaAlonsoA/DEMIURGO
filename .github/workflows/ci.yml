# DEMIURGO v2 CI: four chained stages that together run all of `pnpm gate:all`.
# Each test stage leaves its JUnit report as an artifact; the last one gathers them in `reports/`
# and computes AC → test traceability (`pnpm gate:traceability`) from the tests that passed.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0
  POSTGRES_IMAGE: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
  RUNNER_IMAGE: node:24.21-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  DEMIURGO_TEST_DB_URL: postgres://demiurgo:demiurgo-dev@127.0.0.1:55432/postgres

jobs:
  types-and-lint:
    name: Types, lint, format, design and drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:types
      - run: pnpm gate:lint
      - run: pnpm gate:format
      - run: pnpm gate:design
      - run: pnpm gate:drift

  unit:
    name: Unit tests
    needs: types-and-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project unit --reporter=default --reporter=junit --outputFile.junit=reports/junit-unit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: reports/junit-unit.xml
          if-no-files-found: error

  integration:
    name: Integration tests with Postgres
    needs: unit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: demiurgo
          POSTGRES_PASSWORD: demiurgo-dev
          POSTGRES_DB: demiurgo_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U demiurgo -d demiurgo_dev"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker pull "$RUNNER_IMAGE"
      - run: pnpm vitest run --project integration --reporter=default --reporter=junit --outputFile.junit=reports/junit-integration.xml
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/junit-integration.xml
          if-no-files-found: error

  invariants:
    name: Invariant suite and traceability
    needs: integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: demiurgo
          POSTGRES_PASSWORD: demiurgo-dev
          POSTGRES_DB: demiurgo_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U demiurgo -d demiurgo_dev"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:invariants
        env:
          CI: 'true'
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      - run: pnpm gate:traceability
