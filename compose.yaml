services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: demiurgo:${DEMIURGO_IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:${DEMIURGO_PORT:-8000}:8000"
    environment:
      DEMIURGO_DB: /data/demiurgo.db
      CODEX_HOME: /codex
      DEMIURGO_DISABLE_CODEX: "${DEMIURGO_DISABLE_CODEX:-0}"
    volumes:
      - "${DEMIURGO_DATA_DIR:?Define DEMIURGO_DATA_DIR}:/data"
      - "${DEMIURGO_CODEX_DIR:?Define DEMIURGO_CODEX_DIR}:/codex"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
